spring.application.name=modular-monolith-shop

# Supabase (Postgres) connection - values come from environment variables.
# NEVER hardcode real credentials here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created/seeded manually via sql/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.datasource.hikari.maximum-pool-size=5